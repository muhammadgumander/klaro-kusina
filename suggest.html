<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggest a Dish — Klaro Kusina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F3EC;
    --paper: #FFFDF8;
    --ink: #26301F;
    --ink-soft: #5B6152;
    --brick: #A8402A;
    --sage: #5B7355;
    --sage-soft: #DCE4D2;
    --line: #DEDACB;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 60px 24px;
  }
  .brand{
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--brick);
    margin: 0 0 18px;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.2;
    margin: 0 0 14px;
  }
  .lede{
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0 0 32px;
  }
  form{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
  }
  label{
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  input{
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 18px;
  }
  input:focus{
    outline: none;
    border-color: var(--sage);
  }
  button{
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--sage);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover{ opacity: 0.92; }
  .back-link{
    display: inline-block;
    margin-top: 24px;
    font-size: 13.5px;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .back-link:hover{ color: var(--sage); }
  .thanks{
    text-align: center;
    padding: 20px 0;
  }
  .thanks p{
    color: var(--sage);
    font-weight: 600;
    font-size: 16px;
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="brand">Klaro Kusina</p>
  <h1>Suggest a dish</h1>
  <p class="lede">Have a dish you'd like reviewed and added? Let us know — no account needed, just a name and a dish.</p>

  <form id="suggest-form">
    <label for="name">Your name (optional)</label>
    <input type="text" id="name" name="name" placeholder="e.g. Maria">

    <label for="dish">Dish name</label>
    <input type="text" id="dish" name="dish" placeholder="e.g. Sinigang na Baboy" required>

    <input type="hidden" name="_subject" value="New dish suggestion — Klaro Kusina">

    <button type="submit">Submit suggestion</button>
  </form>

  <a class="back-link" href="./">&larr; Back to Klaro Kusina</a>
</div>

<script>
// Prefill the dish name if arriving from a search result
const urlParams = new URLSearchParams(window.location.search);
const prefill = urlParams.get('dish');
if (prefill) {
  document.getElementById('dish').value = prefill;
}

document.getElementById('suggest-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);

  try {
    await fetch('https://formsubmit.co/ajax/muhammadgumander@gmail.com', {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    });
  } catch (err) {
    // even if this fails silently, we still show the thank-you —
    // FormSubmit's activation step can cause the first submission
    // to behave unusually, so we don't want to alarm the user
  }

  document.querySelector('.wrap').innerHTML = `
    <p class="brand">Klaro Kusina</p>
    <div class="thanks">
      <p>Salamat! 🙏 Thanks for the suggestion — I'll check it out soon.</p>
      <a class="back-link" href="./">&larr; Back to Klaro Kusina</a>
    </div>
  `;
});
</script>

</body>
</html>
